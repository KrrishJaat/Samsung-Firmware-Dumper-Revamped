name: Samsung Firmware Dumper

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: 'Firmware download URL'
        required: true
        type: string

      dump_mode:
        description: 'Select dump type'
        required: true
        type: choice
        options:
        - super_only
        - boot_only
        - both

permissions:
  contents: read

env:
  WORKING_DIR: ./firmware_workspace

jobs:
  samsung-fw-dumper:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash

    # Untrusted workflow_dispatch inputs are copied into env vars here and
    # referenced as $FIRMWARE_URL / $DUMP_MODE in run: steps below, instead of
    # ${{ github.event.inputs.* }}. That avoids splicing raw user input into
    # the shell script text (script-injection hardening recommended by GitHub).
    env:
      FIRMWARE_URL: ${{ github.event.inputs.firmware_url }}
      DUMP_MODE: ${{ github.event.inputs.dump_mode }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    # Idea CC: https://github.com/salvogiangri/UN1CA/blob/be58018b3fc4185078d13035d8f3e7b6af417413/.github/workflows/build.yml#L29
    - name: Free disk space (1/3)
      run: |
        set -euo pipefail
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo docker builder prune -a

    - name: Free disk space (2/3)
      uses: jlumbroso/free-disk-space@v1.1.0
      with:
        tool-cache: true

    - name: Free disk space (3/3)
      uses: rokibhasansagar/slimhub_actions@main
      with:
        retain: 'compiler_cmake'
    # ends

    - name: Setup environment
      run: |
        set -euo pipefail
        mkdir -p "${{ env.WORKING_DIR }}"
        cd "${{ env.WORKING_DIR }}"
        echo "WORKSPACE=$(pwd)" >> "$GITHUB_ENV"

    - name: Install required tools
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y wget unzip tar lz4 jq python3 bc

    - name: Setup lpunpack
      run: |
        set -euo pipefail
        curl -fsSL --retry 3 --retry-delay 5 \
          -o "$WORKSPACE/lpunpack.py" \
          "https://raw.githubusercontent.com/unix3dgforce/lpunpack/master/lpunpack.py"
        chmod +x "$WORKSPACE/lpunpack.py"

    - name: Download firmware
      run: |
        set -euo pipefail
        cd "$WORKSPACE"
        FILENAME=firmware.zip
        echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"

        if [ -z "${FIRMWARE_URL:-}" ]; then
          echo "::error::firmware_url input is empty."
          exit 1
        fi

        wget --tries=3 --timeout=60 -O "$FILENAME" "$FIRMWARE_URL"

        if [ ! -s "$FILENAME" ]; then
          echo "::error::Download produced an empty or missing file. Confirm firmware_url is a direct, wget-accessible link."
          exit 1
        fi

        FILE_SIZE=$(stat -c%s "$FILENAME")
        FILE_SIZE_GB=$(echo "scale=2; $FILE_SIZE / 1073741824" | bc)
        echo "FILE_SIZE_GB=${FILE_SIZE_GB}" >> "$GITHUB_ENV"

    - name: Extract AP only
      run: |
        set -euo pipefail
        cd "$WORKSPACE"
        unzip -q "$FILENAME" -d extracted_zip
        cd extracted_zip

        # -print -quit (not `| head -n 1`): with pipefail on, find can get
        # SIGPIPE'd by head closing the pipe early, which would abort the
        # script even though the AP file was actually found.
        AP_FILE=$(find . -name "AP*.tar.md5" -print -quit)
        if [ -z "$AP_FILE" ]; then
          echo "::error::No AP_*.tar.md5 found inside the firmware zip. The download may be incomplete or this isn't a standard Samsung firmware package."
          exit 1
        fi
        echo "Extracting: $AP_FILE"
        tar -xf "$AP_FILE"

        find . -type f \( -name "*.img" -o -name "*.lz4" \) -exec mv {} ../ \;
        cd ..

    - name: Process LZ4 files
      run: |
        set -euo pipefail
        cd "$WORKSPACE"
        shopt -s nullglob
        for f in *.lz4; do
          lz4 -d "$f" "${f%.lz4}"
        done

    - name: Extract super.img
      if: github.event.inputs.dump_mode == 'super_only' || github.event.inputs.dump_mode == 'both'
      run: |
        set -euo pipefail
        cd "$WORKSPACE"
        mkdir -p extracted_super

        if [ -f super.img ]; then
          python3 lpunpack.py super.img extracted_super/
          rm -f super.img super.img.lz4
        else
          # Non-dynamic-partition firmware (no super.img): fall back to the
          # standalone partition images, matching what the README promises.
          echo "No super.img found - collecting standalone partition images instead."
          shopt -s nullglob
          for img in system.img vendor.img product.img system_dlkm.img vendor_dlkm.img odm.img odm_dlkm.img; do
            [ -f "$img" ] && cp "$img" extracted_super/
          done

          if [ -z "$(ls -A extracted_super)" ]; then
            echo "::error::dump_mode needs super/partition images, but neither super.img nor standalone system/vendor/product images were found."
            exit 1
          fi
        fi

    - name: Collect boot images
      if: github.event.inputs.dump_mode == 'boot_only' || github.event.inputs.dump_mode == 'both'
      run: |
        set -euo pipefail
        cd "$WORKSPACE"
        mkdir -p boot_images

        for img in boot.img init_boot.img vendor_boot.img dtbo.img; do
          if [ -f "$img" ]; then
            cp "$img" boot_images/
          fi
        done

        if [ -z "$(ls -A boot_images)" ]; then
          echo "::error::dump_mode needs boot images, but none of boot.img/init_boot.img/vendor_boot.img/dtbo.img were found."
          exit 1
        fi

    - name: Upload files to GoFile
      run: |
        set -euo pipefail
        cd "$WORKSPACE"

        mkdir -p upload_all
        shopt -s nullglob

        if [ -d "extracted_super" ]; then
          for f in extracted_super/*.img; do cp "$f" upload_all/; done
        fi

        if [ -d "boot_images" ]; then
          for f in boot_images/*.img; do cp "$f" upload_all/; done
        fi

        cd upload_all
        IMAGES=(*.img)

        if [ ${#IMAGES[@]} -eq 0 ]; then
          echo "::error::No .img files were produced to upload."
          exit 1
        fi

        # https://api.gofile.io/servers -> "do not call more than once every
        # 10 seconds" per Gofile's docs, so fetch it once and reuse for every
        # upload in the loop below.
        SERVER=$(curl -fsS https://api.gofile.io/servers | jq -r '.data.servers[0].name // empty')
        if [ -z "$SERVER" ]; then
          echo "::error::Could not obtain a GoFile upload server."
          exit 1
        fi

        : > ../gofile_links.txt
        for img in "${IMAGES[@]}"; do
          LINK=""
          for attempt in 1 2 3; do
            RESPONSE=$(curl -sS -F "file=@${img}" "https://${SERVER}.gofile.io/contents/uploadfile") || RESPONSE=""
            LINK=$(echo "$RESPONSE" | jq -r '.data.downloadPage // empty')
            [ -n "$LINK" ] && break
            echo "Upload attempt $attempt for $img failed, retrying in 5s..."
            sleep 5
          done

          if [ -z "$LINK" ]; then
            echo "$img: UPLOAD FAILED" >> ../gofile_links.txt
          else
            echo "$img: $LINK" >> ../gofile_links.txt
          fi
        done

        echo "----- gofile_links.txt -----"
        cat ../gofile_links.txt

    - name: Upload links
      uses: actions/upload-artifact@v7
      with:
        name: gofile-links
        path: ${{ env.WORKING_DIR }}/gofile_links.txt
        retention-days: 4
        if-no-files-found: error

    - name: Cleanup workspace
      if: always()
      run: |
        if [ -n "${WORKSPACE:-}" ]; then
          rm -rf "$WORKSPACE"
        fi

    - name: Summary
      run: |
        echo "Mode: ${DUMP_MODE:-unknown}"
        echo "Input URL: ${FIRMWARE_URL:-unknown}"
        echo "Original size: ${FILE_SIZE_GB:-unknown}GB"